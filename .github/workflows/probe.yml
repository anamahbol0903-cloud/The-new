name: Build CanProbe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Générer le projet
        run: |
          mkdir -p probe/app/src/main/java/com/fouad/canprobe probe/app/src/main/res/xml probe/app/src/main/res/values
          cat > probe/settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "canprobe"
          include(":app")
          EOF_FILE
          cat > probe/build.gradle.kts <<'EOF_FILE'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > probe/app/build.gradle.kts <<'EOF_FILE'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.fouad.canprobe"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.fouad.canprobe"
              minSdk = 21
              targetSdk = 28
              versionCode = 1
              versionName = "1.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          cat > probe/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_LOGS"/>
            <application android:label="CanProbe" android:theme="@android:style/Theme.DeviceDefault">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".ProbeService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService"/>
                </intent-filter>
                <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
              </service>
            </application>
          </manifest>
          EOF_FILE
          cat > probe/app/src/main/res/xml/acc.xml <<'EOF_FILE'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="100"
            android:description="@string/d"/>
          EOF_FILE
          cat > probe/app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
            <string name="d">CanProbe : enregistre les changements d écran pour détecter les portes.</string>
          </resources>
          EOF_FILE
          cat > probe/app/src/main/java/com/fouad/canprobe/Probe.kt <<'EOF_FILE'
          package com.fouad.canprobe

          import android.content.Context
          import android.os.Build
          import android.provider.Settings
          import java.io.File

          object Probe {
            val steps = listOf(
              "Contact mis. Ne touche à rien pendant 8 secondes",
              "OUVRE la porte AVANT GAUCHE, puis attends 4 secondes",
              "FERME la porte avant gauche, attends 4 secondes",
              "OUVRE la porte AVANT DROITE, attends 4 secondes",
              "FERME la porte avant droite, attends 4 secondes",
              "OUVRE la porte ARRIERE GAUCHE, attends 4 secondes",
              "FERME la porte arrière gauche, attends 4 secondes",
              "OUVRE la porte ARRIERE DROITE, attends 4 secondes",
              "FERME la porte arrière droite, attends 4 secondes",
              "OUVRE le COFFRE, attends 4 secondes",
              "FERME le coffre, attends 4 secondes",
              "OUVRE le CAPOT (si possible), attends 4 secondes",
              "FERME le capot, attends 4 secondes",
              "Allume les feux de POSITION, attends 4 secondes",
              "Éteins les feux, attends 4 secondes",
              "Allume les feux de CROISEMENT, attends 4 secondes",
              "Éteins les feux, attends 4 secondes"
            )
            @Volatile var step = -1
            @Volatile var running = false
            val log = ArrayList<Triple<Int, String, String>>()
            var prev: Map<String, String> = HashMap()
            val seen = HashSet<String>()
            val rx = Regex("\\bcan\\b|canbus|canservice|door|rev:|rzc|raise|syu|mcu|hcn|cem|autocan", RegexOption.IGNORE_CASE)

            fun add(s: Int, k: String, v: String) {
              synchronized(log) { log.add(Triple(s, k, v)) }
            }

            fun snapshot(ctx: Context): Map<String, String> {
              val m = HashMap<String, String>()
              try {
                val p = Runtime.getRuntime().exec("getprop")
                p.inputStream.bufferedReader().forEachLine { l ->
                  val i = l.indexOf("]: [")
                  if (l.startsWith("[") && i > 0) m["prop:" + l.substring(1, i)] = l.substring(i + 4).trimEnd(']')
                }
                p.destroy()
              } catch (e: Exception) {}
              val tabs = listOf("sys" to Settings.System.CONTENT_URI, "sec" to Settings.Secure.CONTENT_URI, "glb" to Settings.Global.CONTENT_URI)
              for (t in tabs) {
                try {
                  val c = ctx.contentResolver.query(t.second, arrayOf("name", "value"), null, null, null)
                  if (c != null) {
                    while (c.moveToNext()) m[t.first + ":" + c.getString(0)] = c.getString(1) ?: ""
                    c.close()
                  }
                } catch (e: Exception) {}
              }
              val svc = ProbeService.inst
              if (svc != null) svc.dump(m)
              return m
            }

            fun readLogcat(st: Int) {
              try {
                val p = Runtime.getRuntime().exec(arrayOf("logcat", "-d", "-v", "brief", "-t", "300"))
                var n = 0
                p.inputStream.bufferedReader().forEachLine { l ->
                  if (n < 20 && rx.containsMatchIn(l) && seen.add(l.take(220))) {
                    add(st, "LOG", l.take(160))
                    n++
                  }
                }
                p.destroy()
              } catch (e: Exception) {}
            }

            fun tick(ctx: Context) {
              val st = step
              if (st < 0) return
              val cur = snapshot(ctx)
              if (prev.isNotEmpty()) {
                for ((k, v) in cur) {
                  val o = prev[k]
                  if (o != v) add(st, k, (o ?: "-").take(60) + " > " + v.take(60))
                }
                for ((k, o) in prev) {
                  if (!cur.containsKey(k)) add(st, k, o.take(60) + " > (absent)")
                }
              }
              prev = cur
              readLogcat(st)
            }

            fun start(ctx: Context) {
              if (running) return
              running = true
              Thread {
                while (running) {
                  try { tick(ctx) } catch (e: Exception) {}
                  try { Thread.sleep(300) } catch (e: InterruptedException) {}
                }
              }.start()
            }

            fun report(): String {
              val sb = StringBuilder()
              sb.append("Android ").append(Build.VERSION.RELEASE).append(" / ").append(Build.MODEL).append(" / ").append(Build.DISPLAY).append("\n")
              val cnt = HashMap<String, Int>()
              val rows = synchronized(log) { ArrayList(log) }
              for (r in rows) if (r.first == 0 && r.second != "LOG" && r.second != "EVT") cnt[r.second] = (cnt[r.second] ?: 0) + 1
              val noise = HashSet<String>()
              for (e in cnt) if (e.value >= 2) noise.add(e.key)
              for (s in 1 until steps.size) {
                sb.append("\n== ").append(s).append(" ").append(steps[s]).append("\n")
                var c = 0
                for (r in rows) {
                  if (r.first == s && !noise.contains(r.second)) {
                    if (c < 40) sb.append(r.second).append(" : ").append(r.third).append("\n")
                    c++
                  }
                }
                if (c > 40) sb.append("... +").append(c - 40).append(" autres\n")
              }
              return sb.toString()
            }

            fun save(ctx: Context, text: String) {
              try { File(ctx.getExternalFilesDir(null), "canprobe.txt").writeText(text) } catch (e: Exception) {}
              try { File("/sdcard/Download/canprobe.txt").writeText(text) } catch (e: Exception) {}
            }
          }
          EOF_FILE
          cat > probe/app/src/main/java/com/fouad/canprobe/ProbeService.kt <<'EOF_FILE'
          package com.fouad.canprobe

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ProbeService : AccessibilityService() {
            companion object {
              @Volatile var inst: ProbeService? = null
            }

            override fun onServiceConnected() {
              inst = this
            }

            override fun onUnbind(i: Intent?): Boolean {
              inst = null
              return super.onUnbind(i)
            }

            override fun onAccessibilityEvent(e: AccessibilityEvent?) {
              if (e != null && e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED && Probe.step > 0) {
                Probe.add(Probe.step, "EVT", (e.packageName?.toString() ?: "?") + "/" + (e.className?.toString() ?: "?"))
              }
            }

            override fun onInterrupt() {}

            fun dump(m: MutableMap<String, String>) {
              try {
                for (w in windows) {
                  val r = w.root ?: continue
                  val pkg = r.packageName?.toString() ?: "?"
                  m["win:" + pkg + "#" + w.type] = "layer " + w.layer
                  if (pkg != packageName && pkg != "com.android.systemui") walk(r, pkg, m, 0, IntArray(1))
                }
              } catch (e: Exception) {}
            }

            private fun walk(n: AccessibilityNodeInfo, pkg: String, m: MutableMap<String, String>, d: Int, c: IntArray) {
              if (c[0] > 500 || d > 25) return
              c[0]++
              val id = n.viewIdResourceName
              val t = n.text?.toString() ?: ""
              val cd = n.contentDescription?.toString() ?: ""
              if (id != null || t.isNotEmpty() || cd.isNotEmpty()) {
                val r = Rect()
                n.getBoundsInScreen(r)
                m["node:" + pkg + "/" + (id ?: n.className) + "@" + r.left + "," + r.top] = "vis=" + n.isVisibleToUser + " t=" + t.take(30) + " d=" + cd.take(30)
              }
              for (i in 0 until n.childCount) {
                val ch = n.getChild(i) ?: continue
                walk(ch, pkg, m, d + 1, c)
              }
            }
          }
          EOF_FILE
          cat > probe/app/src/main/java/com/fouad/canprobe/MainActivity.kt <<'EOF_FILE'
          package com.fouad.canprobe

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
            private lateinit var info: TextView
            private lateinit var btn: Button
            private lateinit var share: Button
            private lateinit var out: TextView
            private var done = false

            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val root = LinearLayout(this)
              root.orientation = LinearLayout.VERTICAL
              root.setPadding(24, 24, 24, 24)
              info = TextView(this)
              info.textSize = 18f
              btn = Button(this)
              share = Button(this)
              share.text = "Partager le rapport"
              share.visibility = View.GONE
              out = TextView(this)
              out.textSize = 11f
              out.typeface = Typeface.MONOSPACE
              val sv = ScrollView(this)
              sv.addView(out)
              root.addView(info)
              root.addView(btn)
              root.addView(share)
              root.addView(sv, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
              setContentView(root)
              btn.setOnClickListener { next() }
              share.setOnClickListener {
                val i = Intent(Intent.ACTION_SEND)
                i.type = "text/plain"
                i.putExtra(Intent.EXTRA_TEXT, out.text.toString())
                startActivity(Intent.createChooser(i, "Partager"))
              }
              refresh()
            }

            override fun onResume() {
              super.onResume()
              refresh()
            }

            private fun next() {
              if (Probe.step < 0) {
                Probe.step = 0
                Probe.start(applicationContext)
              } else if (Probe.step < Probe.steps.size - 1) {
                Probe.step = Probe.step + 1
              } else {
                Probe.running = false
                val r = Probe.report()
                out.text = r
                Probe.save(this, r)
                share.visibility = View.VISIBLE
                info.text = "Terminé. Fais défiler le rapport et prends des captures d'écran. Fichier : Téléchargements/canprobe.txt"
                btn.visibility = View.GONE
                done = true
                return
              }
              refresh()
            }

            private fun refresh() {
              if (done) return
              val acc = ProbeService.inst != null
              val logs = packageManager.checkPermission("android.permission.READ_LOGS", packageName) == PackageManager.PERMISSION_GRANTED
              val head = "Accessibilité : " + (if (acc) "OUI" else "NON (à activer)") + "   Journal système : " + (if (logs) "OUI" else "NON (ADB)") + "\n\n"
              if (Probe.step < 0) {
                info.text = head + "Prêt. Voiture à l'arrêt, contact mis."
                btn.text = "Démarrer"
              } else {
                info.text = head + "Étape " + Probe.step + "/" + (Probe.steps.size - 1) + " :\n" + Probe.steps[Probe.step]
                btn.text = if (Probe.step == Probe.steps.size - 1) "Terminer" else "Suivant"
              }
            }
          }
          EOF_FILE
      - name: Compiler
        working-directory: probe
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CanProbe-apk
          path: probe/app/build/outputs/apk/debug/app-debug.apk
